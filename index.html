<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fart Button</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Green smoke animation background */
        .smoke-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 50%, rgba(0, 255, 80, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(0, 200, 60, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 0%, rgba(50, 255, 100, 0.12) 0%, transparent 50%);
            animation: smokeFlow 8s ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes smokeFlow {
            0%, 100% {
                background: radial-gradient(ellipse at 20% 50%, rgba(0, 255, 80, 0.15) 0%, transparent 50%),
                            radial-gradient(ellipse at 80% 80%, rgba(0, 200, 60, 0.1) 0%, transparent 50%),
                            radial-gradient(ellipse at 50% 0%, rgba(50, 255, 100, 0.12) 0%, transparent 50%);
            }
            25% {
                background: radial-gradient(ellipse at 30% 40%, rgba(0, 255, 80, 0.2) 0%, transparent 50%),
                            radial-gradient(ellipse at 70% 70%, rgba(0, 200, 60, 0.15) 0%, transparent 50%),
                            radial-gradient(ellipse at 40% 20%, rgba(50, 255, 100, 0.15) 0%, transparent 50%);
            }
            50% {
                background: radial-gradient(ellipse at 40% 60%, rgba(0, 255, 80, 0.12) 0%, transparent 50%),
                            radial-gradient(ellipse at 60% 50%, rgba(0, 200, 60, 0.18) 0%, transparent 50%),
                            radial-gradient(ellipse at 60% 30%, rgba(50, 255, 100, 0.1) 0%, transparent 50%);
            }
            75% {
                background: radial-gradient(ellipse at 60% 45%, rgba(0, 255, 80, 0.18) 0%, transparent 50%),
                            radial-gradient(ellipse at 35% 75%, rgba(0, 200, 60, 0.12) 0%, transparent 50%),
                            radial-gradient(ellipse at 70% 60%, rgba(50, 255, 100, 0.15) 0%, transparent 50%);
            }
        }

        .container {
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .view {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Main View */
        .main-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .fart-button {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            border: none;
            cursor: pointer;
            font-size: 48px;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 50px rgba(255, 68, 68, 0.8),
                        inset -5px -5px 15px rgba(0, 0, 0, 0.5),
                        inset 5px 5px 15px rgba(255, 255, 255, 0.2);
            transition: all 0.1s ease;
            position: relative;
            overflow: hidden;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .fart-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255, 68, 68, 1),
                        inset -5px -5px 15px rgba(0, 0, 0, 0.5),
                        inset 5px 5px 15px rgba(255, 255, 255, 0.3);
        }

        .fart-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.8),
                        inset -8px -8px 15px rgba(0, 0, 0, 0.7),
                        inset 5px 5px 10px rgba(255, 255, 255, 0.1);
        }

        .button-label {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* Soundboard View */
        .soundboard-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 900px;
        }

        .soundboard-title {
            font-size: 32px;
            color: #00ff50;
            text-shadow: 0 0 10px rgba(0, 255, 80, 0.8);
            font-weight: bold;
        }

        .soundboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            width: 100%;
            padding: 20px;
        }

        .fart-tile {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #ff6666 0%, #dd0000 100%);
            border: 3px solid #00ff50;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            color: white;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 100, 100, 0.5);
        }

        .fart-tile:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 255, 80, 0.8),
                        0 0 20px rgba(255, 100, 100, 0.8);
            border-color: #00ff80;
        }

        .fart-tile:active {
            transform: scale(0.95);
        }

        .tile-number {
            font-size: 28px;
            color: #00ff50;
        }

        .tile-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 5px;
        }

        /* Navigation */
        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00ff50 0%, #00cc33 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(0, 255, 80, 0.5);
        }

        .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 80, 0.8);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="smoke-bg"></div>

    <div class="container">
        <!-- Main View -->
        <div class="view active main-view" id="mainView">
            <button class="fart-button" id="mainFartBtn">💨</button>
            <div class="button-label">FART ME!</div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="switchView('soundboard')">🎵 Soundboard</button>
            </div>
        </div>

        <!-- Soundboard View -->
        <div class="view soundboard-view" id="soundboardView">
            <div class="soundboard-title">🎵 FART SOUNDBOARD 🎵</div>
            <div class="soundboard-grid" id="soundboardGrid"></div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="switchView('main')">← Back</button>
            </div>
        </div>
    </div>

    <script>
        const FartSounds = {
            farts: [
                { name: 'Classic', pitch: 150, duration: 0.5 },
                { name: 'Squeaky', pitch: 280, duration: 0.3 },
                { name: 'Rumble', pitch: 80, duration: 0.8 },
                { name: 'Pop', pitch: 200, duration: 0.2 },
                { name: 'Wet', pitch: 120, duration: 0.6 },
                { name: 'Foghorn', pitch: 100, duration: 1.0 },
                { name: 'Soprano', pitch: 320, duration: 0.4 },
                { name: 'Double', pitch: 140, duration: 0.9 },
                { name: 'Thunder', pitch: 60, duration: 1.2 },
                { name: 'Trumpet', pitch: 250, duration: 0.7 }
            ],

            playFart(index) {
                const fart = this.farts[index];
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();

                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(fart.pitch, audioContext.currentTime);

                // Pitch modulation for fart effect
                oscillator.frequency.exponentialRampToValueAtTime(
                    fart.pitch * 0.7,
                    audioContext.currentTime + fart.duration
                );

                // Volume envelope
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(
                    0.01,
                    audioContext.currentTime + fart.duration
                );

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + fart.duration);
            }
        };

        function switchView(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if (view === 'main') {
                document.getElementById('mainView').classList.add('active');
            } else if (view === 'soundboard') {
                document.getElementById('soundboardView').classList.add('active');
            }
        }

        // Main fart button
        document.getElementById('mainFartBtn').addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * FartSounds.farts.length);
            FartSounds.playFart(randomIndex);
        });

        // Initialize soundboard
        function initSoundboard() {
            const grid = document.getElementById('soundboardGrid');
            FartSounds.farts.forEach((fart, index) => {
                const tile = document.createElement('button');
                tile.className = 'fart-tile';
                tile.innerHTML = `<div class="tile-number">${index + 1}</div><div class="tile-label">${fart.name}</div>`;
                tile.addEventListener('click', () => FartSounds.playFart(index));
                grid.appendChild(tile);
            });
        }

        initSoundboard();
    </script>
</body>
</html>
